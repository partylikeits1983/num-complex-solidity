name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: npm

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
          cache: true

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check formatting
        run: npm run fmt

      - name: Build without warnings
        run: forge build --deny-warnings

      - name: Check high-precision oracle vectors
        run: npm run oracle:check

      - name: Run unit and invariant tests
        run: npm test

      - name: Run extended fuzz tests
        run: npm run test:fuzz

      - name: Compile a clean package consumer
        run: npm run package:check

      - name: Check gas snapshot
        run: npm run snapshot:check
